
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.hero {
  background: linear-gradient(160deg, #f8f5f0 0%, #ede8e0 100%);
  padding: 4rem 2rem 3rem;
  text-align: center;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.hero-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #854F0B;
  background: #FAEEDA;
  border: 0.5px solid #EF9F27;
  border-radius: 99px;
  padding: 4px 14px;
  margin-bottom: 1.25rem;
}
.hero h1 {
  font-size: 32px;
  font-weight: 500;
  color: #2C2C2A;
  line-height: 1.25;
  margin-bottom: 0.75rem;
  letter-spacing: -0.5px;
}
.hero p {
  font-size: 15px;
  color: #5F5E5A;
  margin-bottom: 2rem;
}
.search-card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 1.25rem 1.5rem;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 12px;
  align-items: end;
  max-width: 720px;
  margin: 0 auto;
}
.field label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--color-text-secondary);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
}
.search-btn {
  height: 36px;
  padding: 0 20px;
  background: #2C2C2A;
  color: #f8f5f0;
  border: none;
  border-radius: var(--border-radius-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.search-btn:hover { background: #444441; }
.section {
  padding: 2rem;
  max-width: 720px;
  margin: 0 auto;
}
.section-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 1rem;
}
.room-card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: 140px 1fr auto;
  align-items: stretch;
}
.room-img {
  background: #D3D1C7;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888780;
  font-size: 28px;
}
.room-info {
  padding: 1rem 1.25rem;
}
.room-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.room-meta {
  font-size: 12px;
  color: var(--color-text-secondary);
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
}
.room-beds {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.bed-tag {
  font-size: 11px;
  background: #F1EFE8;
  color: #444441;
  border: 0.5px solid #B4B2A9;
  border-radius: 99px;
  padding: 2px 10px;
}
.room-price {
  padding: 1rem 1.25rem;
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-left: 0.5px solid var(--color-border-tertiary);
  min-width: 120px;
}
.price-amount {
  font-size: 18px;
  font-weight: 500;
  color: #2C2C2A;
}
.price-unit {
  font-size: 11px;
  color: var(--color-text-secondary);
}
.book-btn {
  margin-top: 8px;
  padding: 6px 16px;
  background: #BA7517;
  color: #fff;
  border: none;
  border-radius: var(--border-radius-md);
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
}
.book-btn:hover { background: #854F0B; }
.combo-label {
  font-size: 11px;
  background: #E6F1FB;
  color: #0C447C;
  border: 0.5px solid #85B7EB;
  border-radius: 99px;
  padding: 2px 10px;
  display: inline-block;
  margin-bottom: 8px;
}
.loading-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--color-text-secondary);
  font-size: 14px;
}
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--color-text-secondary);
  font-size: 14px;
  border: 0.5px dashed var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
}
</style>

<h2 class="sr-only">Trang tìm kiếm phòng khách sạn — nhập ngày check-in, check-out và số khách để xem phòng trống</h2>

<div class="hero">
  <div class="hero-badge">Đặt phòng trực tuyến</div>
  <h1>Tìm phòng phù hợp<br>cho kỳ nghỉ của bạn</h1>
  <p>Nhập thông tin bên dưới để xem các phòng còn trống</p>

  <div class="search-card">
    <div class="field">
      <label>Check-in</label>
      <input type="date" id="checkIn" />
    </div>
    <div class="field">
      <label>Check-out</label>
      <input type="date" id="checkOut" />
    </div>
    <div class="field">
      <label>Số khách</label>
      <input type="number" id="guests" min="1" max="20" value="2" />
    </div>
    <button class="search-btn" onclick="search()">
      <i class="ti ti-search" aria-hidden="true"></i> Tìm phòng
    </button>
  </div>
</div>

<div class="section" id="results" style="display:none">
  <div class="section-title" id="results-title"></div>
  <div id="rooms-list"></div>
</div>

<script>
function formatVND(amount) {
  return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
}

function setDefaults() {
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('checkIn').value = today.toISOString().split('T')[0];
  document.getElementById('checkOut').value = tomorrow.toISOString().split('T')[0];
}

async function search() {
  const checkIn = document.getElementById('checkIn').value;
  const checkOut = document.getElementById('checkOut').value;
  const guests = document.getElementById('guests').value;

  if (!checkIn || !checkOut) {
    alert('Vui lòng chọn ngày check-in và check-out');
    return;
  }
  if (checkIn >= checkOut) {
    alert('Ngày check-out phải sau ngày check-in');
    return;
  }

  const resultsEl = document.getElementById('results');
  const listEl = document.getElementById('rooms-list');
  const titleEl = document.getElementById('results-title');

  resultsEl.style.display = 'block';
  listEl.innerHTML = '<div class="loading-state"><i class="ti ti-loader" style="font-size:20px"></i><br>Đang tìm phòng...</div>';

  try {
    const res = await fetch(
      `http://localhost:3000/booking/available-rooms?checkInDate=${checkIn}&checkOutDate=${checkOut}&adults=${guests}`
    );
    const json = await res.json();

    if (!json.success) throw new Error('Không lấy được dữ liệu');

    const { combinations, availableRooms } = json.data;
    const nights = Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000);

    if (!combinations || combinations.length === 0) {
      titleEl.textContent = 'Không tìm thấy phòng trống';
      listEl.innerHTML = '<div class="empty-state"><i class="ti ti-moon-off" style="font-size:24px; display:block; margin-bottom:8px"></i>Không có phòng trống cho ngày bạn chọn.<br>Vui lòng thử ngày khác.</div>';
      return;
    }

    titleEl.textContent = `${combinations.length} gợi ý phù hợp · ${nights} đêm`;

    listEl.innerHTML = combinations.map(combo => {
      const isMulti = combo.rooms.length > 1;
      const totalPrice = combo.rooms.reduce((sum, r) => sum + (r.roomType.activePrice || 0), 0) * nights;
      const beds = combo.rooms.flatMap(r => r.roomType.roomBeds || []);

      return `
        <div class="room-card">
          <div class="room-img"><i class="ti ti-building" aria-hidden="true"></i></div>
          <div class="room-info">
            ${isMulti ? '<span class="combo-label">Kết hợp ' + combo.rooms.length + ' phòng</span>' : ''}
            <div class="room-name">${combo.rooms.map(r => r.roomType.typeName).join(' + ')}</div>
            <div class="room-meta">
              <span><i class="ti ti-users" style="font-size:13px; vertical-align:-1px" aria-hidden="true"></i> Tối đa ${combo.totalCapacity} khách</span>
              <span><i class="ti ti-moon" style="font-size:13px; vertical-align:-1px" aria-hidden="true"></i> ${nights} đêm</span>
              ${isMulti ? '<span>Tầng ' + combo.rooms.map(r => r.floor).join(', ') + '</span>' : '<span>Tầng ' + combo.rooms[0].floor + ' · Phòng ' + combo.rooms[0].roomNumber + '</span>'}
            </div>
            <div class="room-beds">
              ${beds.map(b => `<span class="bed-tag">${b.quantity}× ${b.roomBedType}</span>`).join('')}
            </div>
          </div>
          <div class="room-price">
            <div>
              <div class="price-amount">${formatVND(totalPrice)}</div>
              <div class="price-unit">${nights} đêm · ${formatVND(Math.round(totalPrice / nights))}/đêm</div>
            </div>
            <button class="book-btn">Đặt phòng</button>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    listEl.innerHTML = '<div class="empty-state">Không thể kết nối tới server. Vui lòng thử lại.</div>';
  }
}

setDefaults();
</script>
