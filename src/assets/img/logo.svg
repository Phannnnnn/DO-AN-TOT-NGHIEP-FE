<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#b026ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer hexagonal ring -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" stroke="url(#feGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" fill="rgba(176,38,255,0.05)"/>
  <!-- Inner stylized 'Q' or building graphic -->
  <path d="M70 70 H130 V130 H100 L85 145 L70 130 Z" stroke="url(#feGrad)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Key lines -->
  <path d="M100 90 V115" stroke="url(#feGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="85" r="10" stroke="url(#feGrad)" stroke-width="4"/>
</svg>
